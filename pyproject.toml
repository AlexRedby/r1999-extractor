[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reverse1999-extractor"
version = "0.1.0"
description = "Local Reverse: 1999 story and voice extraction tools for generic VNTTS packs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cryptography>=46.0.5",
    "numpy>=1.24",
    "platformdirs>=4.3,<5",
    "UnityPy>=1.25,<2",
    "vntts-artifacts[audio]",
]

[project.optional-dependencies]
ui = ["PySide6==6.10.1"]

[dependency-groups]
dev = ["ruff==0.16.2"]

[project.scripts]
r1999-story-index = "r1999extractor.story_index:main"
r1999-migrate-vntts-data = "r1999extractor.migration:main"
r1999-wwise-extract = "r1999extractor.game_audio_cli:extract_main"
r1999-audio-convert = "r1999extractor.game_audio_cli:convert_main"
r1999-audio-score = "r1999extractor.voice_reference_quality:main"
r1999-voice-import = "r1999extractor.reverse1999_voice_import:main"
r1999-playable-voice-index = "r1999extractor.playable_voice:main"
r1999-story-voice-candidates = "r1999extractor.story_voice_candidates:main"
r1999-story-voice-review = "r1999extractor.story_voice_review:main"
r1999-bank-index = "r1999extractor.reverse1999_index:main"
r1999-config-index = "r1999extractor.reverse1999_config:main"
r1999-audition = "r1999extractor.entrypoints:audition_main"
r1999-batch = "r1999extractor.reverse1999_batch:main"
r1999-catalog = "r1999extractor.reverse1999_catalog:main"
r1999-repository-guard = "r1999extractor.repository_guard:main"
r1999-source-audit = "r1999extractor.source_audit:main"
r1999-bootstrap = "r1999extractor.bootstrap:main"
r1999-update-diff = "r1999extractor.update_diff:main"
r1999-source-pack = "r1999extractor.source_pack:main"

[tool.setuptools.packages.find]
include = ["r1999extractor*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv.sources]
vntts-artifacts = { git = "https://github.com/AlexRedby/vntts-artifacts.git", tag = "v0.6.1" }
